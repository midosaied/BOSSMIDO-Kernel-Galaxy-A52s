# Shadow Nexus Tuning - configuration
# Copy this file to /data/adb/shadownexus/tuning.conf and edit it there.
# Empty value = do not touch that setting. Lines starting with # are comments.
# Everything is applied once after boot completes and is NOT persistent:
# removing the module (or leaving a value empty) restores Android's defaults on the next boot.

# Read-ahead for block devices in KB (Android default is usually 128).
# Larger values help sequential reads (big files, app installs). 512 is a modest, low-risk value.
READ_AHEAD_KB=512

# vm.swappiness (0-200). Higher = move cold pages to zram sooner. Empty = leave ROM default.
SWAPPINESS=

# vm.vfs_cache_pressure. Lower = keep filesystem caches longer. Empty = leave ROM default.
VFS_CACHE_PRESSURE=

# zram compression algorithm (lzo-rle | lz4 | zstd). EXPERIMENTAL / OFF by default.
# When set, zram is re-created once after boot: swapoff, reset, set algorithm, mkswap, swapon.
# It is skipped automatically if more than ZRAM_MAX_USED_MB of swap is in use.
ZRAM_ALGO=
ZRAM_MAX_USED_MB=300
